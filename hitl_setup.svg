<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 820 520" xmlns="http://www.w3.org/2000/svg" font-family="'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0d2240"/>
      <stop offset="100%" stop-color="#060e1a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Wing top-surface gradient: lighter at LE, darker at TE -->
    <linearGradient id="wingTop" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#42a5f5"/>
      <stop offset="40%"  stop-color="#1e88e5"/>
      <stop offset="100%" stop-color="#0a2f6e"/>
    </linearGradient>
    <!-- Elevon panel (slightly different shade) -->
    <linearGradient id="elevonGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#1565c0"/>
      <stop offset="100%" stop-color="#0d2a5e"/>
    </linearGradient>
    <!-- Body pod gradient -->
    <linearGradient id="bodyGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#263238"/>
      <stop offset="100%" stop-color="#102030"/>
    </linearGradient>
    <!-- Prop shadow -->
    <radialGradient id="propShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#1a3a5a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1a3a5a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Background ── -->
  <rect width="820" height="520" fill="url(#bgGrad)"/>

  <!-- Stars -->
  <g fill="white" opacity="0.5">
    <circle cx="30"  cy="20"  r="1"/><circle cx="80"  cy="55"  r="0.8"/>
    <circle cx="150" cy="15"  r="1.2"/><circle cx="200" cy="70"  r="0.7"/>
    <circle cx="310" cy="30"  r="1"/><circle cx="400" cy="18"  r="0.9"/>
    <circle cx="490" cy="45"  r="0.7"/><circle cx="570" cy="22"  r="1.1"/>
    <circle cx="660" cy="38"  r="0.8"/><circle cx="750" cy="15"  r="1"/>
    <circle cx="800" cy="60"  r="0.7"/><circle cx="60"  cy="120" r="0.6"/>
    <circle cx="140" cy="100" r="0.9"/><circle cx="700" cy="90"  r="0.8"/>
    <circle cx="780" cy="110" r="1"/><circle cx="50"  cy="200" r="0.7"/>
    <circle cx="790" cy="200" r="0.9"/><circle cx="260" cy="80"  r="0.7"/>
  </g>

  <!-- Title -->
  <text x="410" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="white" filter="url(#glow)">
    HITL Physical Setup — FX-61 Phantom
  </text>

  <!-- ═══════════════════════════════════════
       RC TRANSMITTER  (left)
  ═══════════════════════════════════════ -->
  <g transform="translate(62,72)">
    <rect x="0" y="0" width="120" height="150" rx="12" fill="#1a1a2e" stroke="#3a3a5e" stroke-width="2"/>
    <rect x="10" y="10" width="100" height="55" rx="5" fill="#0a2244" stroke="#1a73e8" stroke-width="1"/>
    <text x="60" y="30" text-anchor="middle" font-size="9"  fill="#4a9eff">RC  TX</text>
    <text x="60" y="44" text-anchor="middle" font-size="8"  fill="#aad4f5">2.4 GHz  MODE 2</text>
    <rect x="18" y="50" width="5"  height="8"  rx="1" fill="#27ae60"/>
    <rect x="26" y="46" width="5"  height="12" rx="1" fill="#27ae60"/>
    <rect x="34" y="42" width="5"  height="16" rx="1" fill="#27ae60"/>
    <rect x="42" y="38" width="5"  height="20" rx="1" fill="#27ae60" opacity="0.4"/>
    <rect x="76" y="50" width="28" height="10" rx="2" fill="#27ae60" stroke="#1e8449" stroke-width="0.8"/>
    <rect x="104" y="53" width="3" height="4"  rx="1" fill="#1e8449"/>
    <circle cx="20"  cy="85" r="7" fill="#e74c3c" stroke="#c0392b" stroke-width="1"/>
    <circle cx="45"  cy="85" r="7" fill="#27ae60" stroke="#1e8449" stroke-width="1"/>
    <circle cx="75"  cy="85" r="7" fill="#f39c12" stroke="#d68910" stroke-width="1"/>
    <circle cx="100" cy="85" r="7" fill="#9b59b6" stroke="#7d3c98" stroke-width="1"/>
    <circle cx="30"  cy="120" r="18" fill="#111128" stroke="#3a3a5e" stroke-width="1.5"/>
    <circle cx="90"  cy="120" r="18" fill="#111128" stroke="#3a3a5e" stroke-width="1.5"/>
    <circle cx="30"  cy="120" r="6"  fill="#2d4a6e" stroke="#4a7ab5" stroke-width="1"/>
    <circle cx="90"  cy="120" r="6"  fill="#2d4a6e" stroke="#4a7ab5" stroke-width="1"/>
    <line x1="30" y1="0" x2="18" y2="-35" stroke="#3a3a5e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="18" cy="-38" r="4" fill="#e74c3c"/>
    <line x1="90" y1="0" x2="102" y2="-35" stroke="#3a3a5e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="102" cy="-38" r="4" fill="#e74c3c"/>
  </g>
  <text x="122" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="white">RC Transmitter</text>
  <text x="122" y="258" text-anchor="middle" font-size="10" fill="#aaaacc">2.4 GHz Telemetry</text>

  <!-- ═══════════════════════════════════════
       LAPTOP  (right)
  ═══════════════════════════════════════ -->
  <rect x="490" y="65" width="290" height="190" rx="8" fill="#1a1a2e" stroke="#3a3a5e" stroke-width="2"/>
  <rect x="500" y="74" width="270" height="172" rx="4" fill="#0a1628"/>
  <rect x="504" y="78" width="262" height="164" rx="2" fill="#0d2137"/>
  <rect x="504" y="78"  width="262" height="82" rx="2" fill="#1a4a7a"/>
  <rect x="504" y="160" width="262" height="82" rx="2" fill="#1a3a1a"/>
  <line x1="504" y1="160" x2="766" y2="160" stroke="#4a8a4a" stroke-width="1"/>
  <rect x="516" y="84" width="68" height="16" rx="3" fill="#0d2137" stroke="#4a9eff" stroke-width="0.5"/>
  <text x="550" y="96" text-anchor="middle" font-size="8" fill="#4a9eff">X-Plane 11</text>
  <ellipse cx="635" cy="138" rx="28" ry="28" fill="none" stroke="#4a9eff" stroke-width="1" opacity="0.6"/>
  <line x1="607" y1="138" x2="663" y2="138" stroke="#4a9eff" stroke-width="0.8" opacity="0.6"/>
  <line x1="635" y1="110" x2="635" y2="166" stroke="#4a9eff" stroke-width="0.8" opacity="0.6"/>
  <polygon points="635,124 615,134 615,144 635,139 655,144 655,134" fill="#7ecfff" opacity="0.8"/>
  <rect x="720" y="84" width="40" height="28" rx="3" fill="#0d2137" stroke="#4a9eff" stroke-width="0.5"/>
  <text x="740" y="96"  text-anchor="middle" font-size="7" fill="#aad4f5">ALT</text>
  <text x="740" y="107" text-anchor="middle" font-size="9" font-weight="bold" fill="#4a9eff">738m</text>
  <rect x="480" y="255" width="310" height="14" rx="4" fill="#111128" stroke="#3a3a5e" stroke-width="1.5"/>
  <rect x="595" y="270" width="80"  height="8"  rx="3" fill="#1a1a2e" stroke="#3a3a5e" stroke-width="0.8"/>
  <rect x="530" y="248" width="110" height="22" rx="5" fill="#9b59b6" opacity="0.9"/>
  <text x="585" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="white">QGroundControl</text>
  <rect x="650" y="248" width="80"  height="22" rx="5" fill="#1a73e8" opacity="0.9"/>
  <text x="690" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="white">pppd</text>
  <text x="635" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Laptop</text>
  <text x="635" y="314" text-anchor="middle" font-size="11" fill="#aaaacc">macOS / Linux · X-Plane + QGC</text>
  <rect x="484" y="192" width="8" height="12" rx="1" fill="#e8a000" stroke="#f39c12" stroke-width="0.5"/>
  <rect x="484" y="212" width="8" height="12" rx="1" fill="#9b59b6" stroke="#c77dff" stroke-width="0.5"/>

  <!-- ═══════════════════════════════════════
       FX-61 PHANTOM — top-down view
       Nose points upper-right toward laptop.
       All coordinates in aircraft-local space
       (nose at +x, wingspan along ±y).
  ═══════════════════════════════════════ -->
  <g transform="translate(305,280) rotate(0) scale(0.75)">

    <!-- ── Shadow / ground reflection ── -->
    <ellipse cx="-20" cy="4" rx="170" ry="30" fill="#000" opacity="0.25"/>

    <!-- ── Main wing planform ──
         FX-61 characteristic: straight-ish swept LE from root,
         slightly curved toward tip; straight TE with elevon break.
    -->
    <!-- PORT (upper) wing -->
    <path d="
      M  92, 0
      C  75,-10  38,-55  -30,-112
      C  -55,-138 -72,-158  -80,-165
      L  -36,-165
      C  -30,-138  -10,-110   20,-68
      C   44,-38   68,-14   92,  0
      Z"
      fill="url(#wingTop)" stroke="#1565c0" stroke-width="1.2"/>

    <!-- STARBOARD (lower) wing — mirror -->
    <path d="
      M  92, 0
      C  75, 10  38, 55  -30, 112
      C  -55, 138 -72, 158  -80, 165
      L  -36, 165
      C  -30, 138  -10, 110   20,  68
      C   44,  38   68,  14   92,   0
      Z"
      fill="url(#wingTop)" stroke="#1565c0" stroke-width="1.2"/>

    <!-- ── Elevon panels (trailing ≈30% of each wing) ── -->
    <!-- Port elevon -->
    <path d="
      M  20,-68
      C  -10,-110 -30,-138  -36,-165
      L  -80,-165
      C  -72,-158  -55,-138  -30,-112
      C   -0,-76    18,-56   20,-68
      Z"
      fill="url(#elevonGrad)" stroke="#0d47a1" stroke-width="0.8"/>
    <!-- Starboard elevon -->
    <path d="
      M  20, 68
      C  -10, 110 -30, 138  -36, 165
      L  -80, 165
      C  -72, 158  -55, 138  -30, 112
      C   -0,  76   18,  56   20,  68
      Z"
      fill="url(#elevonGrad)" stroke="#0d47a1" stroke-width="0.8"/>

    <!-- Elevon hinge lines -->
    <line x1="20" y1="-68" x2="-36" y2="-165" stroke="#7ab4ff" stroke-width="0.8" opacity="0.7"/>
    <line x1="20" y1=" 68" x2="-36" y2=" 165" stroke="#7ab4ff" stroke-width="0.8" opacity="0.7"/>

    <!-- ── Winglets (canted fins at tips) ── -->
    <!-- Port winglet -->
    <ellipse cx="-58" cy="-165" rx="24" ry="5"
             fill="#0d47a1" stroke="#1565c0" stroke-width="1"
             transform="rotate(30,-58,-165)"/>
    <!-- Starboard winglet -->
    <ellipse cx="-58" cy="165" rx="24" ry="5"
             fill="#0d47a1" stroke="#1565c0" stroke-width="1"
             transform="rotate(-30,-58,165)"/>

    <!-- ── Wing surface detail — rib/panel lines ── -->
    <line x1="60"  y1=" -6" x2="-15"  y2="-96"  stroke="#5b9bd5" stroke-width="0.5" opacity="0.4"/>
    <line x1="30"  y1="-12" x2="-42"  y2="-130" stroke="#5b9bd5" stroke-width="0.5" opacity="0.4"/>
    <line x1="60"  y1="  6" x2="-15"  y2=" 96"  stroke="#5b9bd5" stroke-width="0.5" opacity="0.4"/>
    <line x1="30"  y1=" 12" x2="-42"  y2=" 130" stroke="#5b9bd5" stroke-width="0.5" opacity="0.4"/>
    <!-- LE highlight -->
    <path d="M 88,-4 C 70,-14 30,-62 -34,-118" fill="none" stroke="white" stroke-width="1.2" opacity="0.15"/>
    <path d="M 88, 4 C 70, 14 30,  62 -34, 118" fill="none" stroke="white" stroke-width="1.2" opacity="0.15"/>

    <!-- ── Central body (blended wing body) ── -->
    <path d="
      M  92, 0
      C  85,-8   68,-14   40,-16
      L -68,-14
      C -76,-10  -80,-6  -80,  0
      C -80,  6  -76, 10 -68, 14
      L  40, 16
      C  68, 14   85,  8  92,  0
      Z"
      fill="url(#bodyGrad)" stroke="#37474f" stroke-width="1.2"/>

    <!-- Body ridge line -->
    <path d="M 88,0 C 60,0 20,0 -76,0" fill="none" stroke="#546e7a" stroke-width="0.6" opacity="0.6"/>

    <!-- ── Nose cone ── -->
    <ellipse cx="88" cy="0" rx="10" ry="6" fill="#263238" stroke="#455a64" stroke-width="1"/>
    <!-- Camera dome at nose -->
    <ellipse cx="94" cy="0" rx="5" ry="4" fill="#37474f" stroke="#546e7a" stroke-width="0.8"/>
    <circle  cx="95" cy="0" r="2" fill="#1a2a3a" stroke="#455a64" stroke-width="0.5"/>

    <!-- ── Pusher motor mount ── -->
    <ellipse cx="-72" cy="0" rx="12" ry="8" fill="#1a2030" stroke="#455a64" stroke-width="1"/>
    <!-- Motor bell -->
    <ellipse cx="-78" cy="0" rx="7" ry="7" fill="#2d3748" stroke="#4a5568" stroke-width="1"/>
    <!-- Prop disc (semi-transparent) -->
    <ellipse cx="-78" cy="0" rx="28" ry="28" fill="url(#propShadow)" stroke="none"/>
    <!-- Prop blades -->
    <ellipse cx="-78" cy="0" rx="26" ry="3.5" fill="#546e7a" opacity="0.75" stroke="#607d8b" stroke-width="0.5"/>
    <ellipse cx="-78" cy="0" rx="3.5" ry="26" fill="#546e7a" opacity="0.75" stroke="#607d8b" stroke-width="0.5"/>
    <circle  cx="-78" cy="0" r="4.5"  fill="#37474f" stroke="#607d8b" stroke-width="0.8"/>
    <circle  cx="-78" cy="0" r="2"    fill="#263238"/>

    <!-- ── Pixhawk FC (center pod, slightly forward) ── -->
    <rect x="-10" y="-9" width="24" height="18" rx="3"
          fill="#c0392b" stroke="#922b21" stroke-width="1.2"/>
    <text x="2"  y="-2" text-anchor="middle" font-size="6" font-weight="bold" fill="white">PX</text>
    <text x="2"  y=" 7" text-anchor="middle" font-size="5" fill="#ffaaaa">fmuv3</text>
    <!-- Status LED -->
    <circle cx="10" cy="-5" r="2" fill="#2ecc71"/>
    <!-- USB port dot (SERIAL0 — top of body) -->
    <circle cx="2"  cy="-13" r="3.5" fill="#e8a000" stroke="#f39c12" stroke-width="1"/>
    <!-- TELEM2 port dot (bottom of body) -->
    <circle cx="2"  cy=" 13" r="3.5" fill="#9b59b6" stroke="#c77dff" stroke-width="1"/>

    <!-- ── RC Receiver (just aft of FC) ── -->
    <rect x="-38" y="-7" width="18" height="14" rx="2"
          fill="#27ae60" stroke="#1e8449" stroke-width="0.8"/>
    <text x="-29" y="3" text-anchor="middle" font-size="5" fill="white">RX</text>
    <!-- Antenna wire -->
    <line x1="-38" y1="-7" x2="-50" y2="-20" stroke="#aaaaaa" stroke-width="0.8"/>
    <circle cx="-50" cy="-20" r="1.5" fill="#aaaaaa"/>

  </g>

  <!-- Aircraft label -->
  <text x="305" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="white">FX-61 Phantom</text>
  <text x="305" y="448" text-anchor="middle" font-size="10" fill="#aaaacc">Pixhawk v2  fmuv3-hil · flying wing</text>

  <!-- ═══════════════════════════════════════
       2.4 GHz RADIO LINK (dashed orange)
  ═══════════════════════════════════════ -->
  <path d="M 164,34 C 190,80 230,160 283,272"
        fill="none" stroke="#f39c12" stroke-width="2.5"
        stroke-dasharray="10,6" opacity="0.85"/>
  <!-- Radio wave arcs near TX antenna -->
  <path d="M 128,50 Q 160,18 192,50" fill="none" stroke="#f39c12" stroke-width="1.5" opacity="0.6"/>
  <path d="M 116,44 Q 156,3  196,44" fill="none" stroke="#f39c12" stroke-width="1"   opacity="0.35"/>
  <rect x="148" y="135" width="90" height="24" rx="6" fill="#2a1a00" stroke="#f39c12" stroke-width="1.2"/>
  <text x="193" y="151" text-anchor="middle" font-size="10" font-weight="bold" fill="#f39c12">2.4 GHz Radio</text>

  <!-- ═══════════════════════════════════════
       USB MAVLink cable  (purple)
  ═══════════════════════════════════════ -->
  <path d="M 492,198 C 430,208 375,230 309,262"
        fill="none" stroke="#c77dff" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="364" y="196" width="116" height="34" rx="7" fill="#2d0a4e" stroke="#c77dff" stroke-width="1.5"/>
  <text x="422" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#c77dff">USB Cable</text>
  <text x="422" y="224" text-anchor="middle" font-size="9"  fill="#e8d5ff">MAVLink2 · 921600</text>

  <!-- ═══════════════════════════════════════
       USB-UART PPP cable  (orange solid)
  ═══════════════════════════════════════ -->
  <path d="M 492,218 C 430,228 375,258 309,282"
        fill="none" stroke="#f39c12" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="354" y="240" width="130" height="44" rx="7" fill="#2a1a00" stroke="#f39c12" stroke-width="1.5"/>
  <text x="419" y="256" text-anchor="middle" font-size="10" font-weight="bold" fill="#f39c12">USB–UART adapter</text>
  <text x="419" y="269" text-anchor="middle" font-size="9"  fill="#ffd580">PPP · 115200 baud</text>
  <text x="419" y="281" text-anchor="middle" font-size="9"  fill="#ffd580">10.0.0.1 ↔ 10.0.0.2</text>

  <!-- ═══════════════════════════════════════
       Legend
  ═══════════════════════════════════════ -->
  <rect x="20" y="465" width="780" height="44" rx="8" fill="#0a1628" stroke="#2a3a5a" stroke-width="1"/>
  <line x1="38"  y1="487" x2="78"  y2="487" stroke="#f39c12" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="86"  y="491" font-size="11" fill="#e0e0e0">2.4 GHz Radio (RC control)</text>
  <line x1="290" y1="487" x2="330" y2="487" stroke="#c77dff" stroke-width="3.5"/>
  <text x="338" y="491" font-size="11" fill="#e0e0e0">USB Cable (MAVLink / QGC)</text>
  <line x1="530" y1="487" x2="570" y2="487" stroke="#f39c12" stroke-width="3.5"/>
  <text x="578" y="491" font-size="11" fill="#e0e0e0">USB–UART (PPP / X-Plane)</text>

</svg>
